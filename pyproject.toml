[project]
name = "ascii-earth-forecast"
version = "0.1.0"
description = "Daily weather and satellite position forecasts scored against this week's data"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "sgp4>=2.24,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
# research/ needs torch and pyarrow, which the package and its CI job do not install.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forecast"]

[tool.setuptools.package-data]
forecast = ["drift_weights.npz"]
