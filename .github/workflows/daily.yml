name: daily

on:
  schedule:
    - cron: "37 1 * * *"
    # GitHub can drop a scheduled run. This one fetches only what the first did not finish.
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install .
      # The write token is set only on these two steps, away from pip and the forecast code.
      - run: scripts/data_branch.sh restore "$REMOTE" data
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      # A failed run still publishes, so the page can say which source is stale.
      - id: forecast
        run: python -m forecast data
        continue-on-error: true
      # The data branch keeps yesterday's files when today's could not be read.
      - run: python -m forecast.check data
      - run: scripts/data_branch.sh publish "$REMOTE" "$PWD/data"
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      # GitHub disables scheduled workflows after 60 days without repository activity.
      - if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
      - if: steps.forecast.outcome == 'failure'
        run: exit 1
